<!DOCTYPE html>
<html>
<head>
<title>Student Enrollment Web App</title>
</head>
<body>
    <style>
        body {
            background-color: rgb(143, 227, 255);
            font-size: 20px;
        }

        .login {
            text-align:center;
        }

        p {
            display: inline-block; 
            vertical-align: middle;
            padding-right: 10px;
        }   

        input {
            font-family: Cambria;
            width: 200px;
            height: 30px;
            border-radius: 12px;
            border: none;
            font-size: 15px;
        }

        button {
            background-color: rgb(52, 172, 247);
            color: white;
            text-align: center;
            font-family: Cambria;
            font-size: 18px;
            padding: 15px 100px;
            border: 2px solid white;
            border-radius: 12px;
            margin-top: 20px;
        }

        button:active{
            transform: translateY(1px);
        }
    </style>

    <h1 style="text-align:center">Meow University</h1>

    <div class="login">
        <p>Username</p>
        <input type="text" placeholder="username"><br>
    
        <p>Password</p>
        <input type="password" placeholder="password"><br>

        <button>Sign In</button>
    </div>

</body>
</html>
